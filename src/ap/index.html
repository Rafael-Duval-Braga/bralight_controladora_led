<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Bralight Control</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121216;
      --card: #1c1c24;
      --surface: #121216;
      --text: #f4f4f6;
      --muted: #a1a1aa;
      --border: #2e2e3a;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .status {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .wheel-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 0;
    }

    #colorWheel {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      touch-action: none;
      cursor: crosshair;
      display: block;
    }

    .control-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    label[for="dimmerSlider"] {
      font-weight: 600;
    }

    #dimmerValue {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--muted);
      font-size: 0.85rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      touch-action: none;
      margin: 2px 0;
    }

    .readout {
      width: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <h1>Bralight Control</h1>
      <span id="status" class="status">Conectando...</span>
    </div>

    <div class="wheel-wrap">
      <canvas id="colorWheel" width="260" height="260" aria-label="Roda de cores RGB"></canvas>
    </div>

    <div class="control-box">
      <div class="control-top">
        <label for="dimmerSlider">Intensidade</label>
        <span id="dimmerValue">255 (100%)</span>
      </div>
      <input id="dimmerSlider" type="range" min="0" max="255" value="255" />
    </div>

    <div id="rgbReadout" class="readout">Cor base: (255, 0, 0) · Dimmer (d): 255</div>
  </main>

  <script src="/site.js"></script>
</body>
</html>
