# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml

esphome:
  name: bralight-control-board-1
  friendly_name: bralight_control_board_1

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "hJs4TQvSxpTcIxIY1mg0bFlOXA6TVjkX8RS7LMPhE8A="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: bralight_contro Fallback Hotspot
    password: "raySafbR1Jli"

captive_portal:

# Configuração da saída de Hardware PWM (LEDC)
output:
  - platform: ledc
    pin: GPIO8
    id: led_pwm
    frequency: 1000Hz # Frequência recomendada para LEDs (evita cintilação)

# Exposição da saída PWM como uma luz dimerizável no Home Assistant
light:
  - platform: monochromatic
    output: led_pwm
    name: "Luminaria"
    id: luminaria_led